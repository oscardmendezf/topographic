name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Auditoría de cobertura (bloquea el deploy si hay huecos)
        run: python3 pipeline/audit_cobertura.py
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Instalar dependencias
        working-directory: site
        run: npm ci
      - name: Build (Astro + Pagefind)
        working-directory: site
        run: npm run build
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a Pages
        id: deployment
        uses: actions/deploy-pages@v4
